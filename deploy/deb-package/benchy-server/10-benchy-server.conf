# Installed by the benchy-server package; replaced on every upgrade. Put your own changes in
# /etc/systemd/system/phoromatic-server.service.d/ (a file there named to sort after "10-" wins).
[Service]
User=phoromatic
Group=phoromatic
Environment=HOME=/var/lib/phoromatic
Environment=PHOROMATIC_HTTP_PORT=39080
Environment=PTS_FORCE_DAEMONIZED=1
RestartSec=5
RestartPreventExitStatus=78
